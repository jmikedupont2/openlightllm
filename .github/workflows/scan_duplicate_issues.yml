name: Scan Duplicate Issues (One-Time)

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Similarity threshold (0-1)"
        required: false
        default: "0.85"
      close:
        description: "Actually close duplicates (false = dry run)"
        required: false
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Scan for duplicate issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_THRESHOLD: ${{ inputs.threshold }}
          INPUT_CLOSE: ${{ inputs.close }}
        run: |
          CLOSE_FLAG=""
          if [ "$INPUT_CLOSE" = "true" ]; then
            CLOSE_FLAG="--close"
          fi
          python3 .github/scripts/close_duplicate_issues.py \
            --scan \
            --repo ${{ github.repository }} \
            --threshold "$INPUT_THRESHOLD" \
            $CLOSE_FLAG
